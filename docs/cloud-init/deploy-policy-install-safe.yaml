defaults:
  profile: admin
  distro_series: jammy
  storage:
    efi_size: 2G
    boot_size: 2G
    root_size: 200G
    data_mount: /data
  networking:
    apply_on_first_boot: false
    predictable_interface_names: true
    predictable_interface_kernel_cmdline: "net.ifnames=1 biosdevname=0"
    bond25g:
      bond_name: bond0
      interfaces:
        - ens12f0np0
        - ens12f1np1
      parameters:
        mode: 802.3ad
        mii-monitor-interval: 100
        transmit-hash-policy: layer3+4
  sudo_user:
    name: ubuntu
    gecos: Ubuntu Admin
    groups:
      - adm
      - sudo
    shell: /bin/bash
    password: "Lexun@12#$"
    sudo_nopasswd: true
    ssh_authorized_keys: []
  root:
    enabled: true
    password: "Lexun@12#$"
  ssh:
    password_authentication: true
    permit_root_login: true
    pubkey_authentication: true
    allow_users:
      - ubuntu
      - root
  cloud_init:
    package_update: false
    package_upgrade: false
    package_reboot_if_required: false
    ssh_import_id: []
    snap:
      commands: []
    byobu_by_default: disable-user

policy_match_order:
  - h100
  - gpu
  - default

policies:
  default: {}

  gpu:
    match_tags:
      - gpu
      - a800
    storage:
      root_size: 200G
    sudo_user:
      name: gpuops
      gecos: GPU Ops
      password: "GpuOps@123"
      sudo_nopasswd: true
    ssh:
      allow_users:
        - gpuops
        - root

  h100:
    match_tags:
      - h100
    storage:
      root_size: 300G
    sudo_user:
      name: h100ops
      gecos: H100 Ops
      password: "H100Ops@123"
      sudo_nopasswd: true
    ssh:
      allow_users:
        - h100ops
        - root
